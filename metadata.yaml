name: astrbot_plugin_friberg_guess
display_name: 猜选手 · 弗一把/足一把/撸一把/瓦一把
short_desc: 群里猜 CS 选手、足球球员、LoL 选手、瓦罗兰特选手，支持独猜与双人/多人回合制。
desc: >-
  四合一的「猜选手」游戏（类 Wordle）。发「弗一把」「足一把」「撸一把」「瓦一把」开局，
  弗一把默认出「最火 200 人」（不含教练），足一把默认出「知名 250 人」（现役 190 + 退役传奇 60），还能限定联赛
  （英超/西甲/德甲/意甲/法甲/五大），撸一把默认出热门 150 人（现役 + 知名退役，带战队与 S 赛战绩），
  瓦一把默认出热门 150 人（含退役老将与现役自由人）。
  默认是独猜（各猜各的）；发「弗一把 双人」「弗一把 多人」可以开组队房，
  别人发「加入」进队，全队共用同一个答案和一份机会、按加入顺序回合制轮流猜，猜中全队记一胜。
  配置里开「仅开启独猜」就彻底关掉组队。
  猜一位选手后按各题库的属性逐格给出接近度反馈：CS 比国家/赛区/战队/年龄/位置/
  Major 冠军/出场/状态，足球比国籍/联赛/俱乐部/位置/出生年/号码/欧冠/世界杯，
  LoL 比位置/国家/大洲/战队/年龄/S 赛参赛/S 赛冠军/状态，瓦罗兰特比国籍/赛区/战队/身份/职责/年龄/
  大师赛/冠军赛战绩。次数用尽或超时公布答案。
version: 1.11.0
author: weadee
repo: https://github.com/weadee/astrbot_plugin_friberg_guess
astrbot_version: ">=4.9.2"
support_platforms:
  - aiocqhttp
  - qq_official
  - qq_official_webhook
  - telegram
  - lark
  - dingtalk
  - discord
  - slack
  - kook
  - satori
